<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer hexagon shape -->
  <path d="M50 5 L85 25 L85 75 L50 95 L15 75 L15 25 Z" 
        fill="none" 
        stroke="#d9fb06" 
        stroke-width="4"
        stroke-linejoin="round"
        filter="url(#glow)"/>
  <!-- Code brackets </> -->
  <g fill="none" stroke="#d9fb06" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left bracket < -->
    <polyline points="38,35 25,50 38,65"/>
    <!-- Right bracket > -->
    <polyline points="62,35 75,50 62,65"/>
    <!-- Slash / -->
    <line x1="55" y1="30" x2="45" y2="70"/>
  </g>
</svg>