<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#f8f8f8" />
    </linearGradient>
  </defs>
  
  <!-- Clean, elegant background -->
  <rect width="1200" height="600" fill="url(#bgAfter)"/>
  
  <!-- Minimal header -->
  <rect width="1200" height="80" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="50" font-size="24" font-weight="bold" fill="#000000">BRAND</text>
  
  <!-- Clean navigation with subtle lines -->
  <line x1="850" y1="20" x2="1150" y2="20" stroke="#333" stroke-width="1"/>
  <line x1="850" y1="50" x2="1150" y2="50" stroke="#333" stroke-width="1"/>
  <line x1="850" y1="80" x2="1150" y2="80" stroke="#333" stroke-width="1"/>
  
  <!-- Hero section with breathing room -->
  <rect y="80" width="1200" height="200" fill="#fafafa"/>
  <text x="60" y="160" font-size="48" font-weight="bold" fill="#000000">Elegant Design</text>
  <text x="60" y="210" font-size="16" fill="#666666">Clean, minimalist, and professionally crafted</text>
  
  <!-- CTA Button -->
  <rect x="60" y="240" width="160" height="48" fill="#000000" rx="2"/>
  <text x="90" y="270" font-size="14" fill="#ffffff" font-weight="bold">Get Started</text>
  
  <!-- Three clean sections -->
  <rect x="50" y="310" width="340" height="240" fill="#ffffff" stroke="#d0d0d0" stroke-width="1" rx="2"/>
  <rect x="50" y="310" width="340" height="140" fill="#f5f5f5"/>
  <text x="70" y="490" font-size="16" font-weight="bold" fill="#000000">Timeless Quality</text>
  <text x="70" y="530" font-size="13" fill="#888888">Crafted with attention to every detail</text>
  
  <rect x="430" y="310" width="340" height="240" fill="#ffffff" stroke="#d0d0d0" stroke-width="1" rx="2"/>
  <rect x="430" y="310" width="340" height="140" fill="#f5f5f5"/>
  <text x="450" y="490" font-size="16" font-weight="bold" fill="#000000">Modern Innovation</text>
  <text x="450" y="530" font-size="13" fill="#888888">Leveraging the latest technologies</text>
  
  <rect x="810" y="310" width="340" height="240" fill="#000000" rx="2"/>
  <rect x="810" y="310" width="340" height="140" fill="#1a1a1a"/>
  <text x="830" y="490" font-size="16" font-weight="bold" fill="#ffffff">Sophisticated Style</text>
  <text x="830" y="530" font-size="13" fill="#cccccc">Premium experience in every interaction</text>
  
  <!-- Subtle footer -->
  <rect y="570" width="1200" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="590" font-size="11" fill="#999999">© 2024 Brand. All rights reserved. | Privacy | Terms</text>
</svg>