<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBefore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b6b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffb347" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1cd2ff" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Loud background -->
  <rect width="1200" height="600" fill="url(#bgBefore)" />
  <rect width="1200" height="600" fill="#ffffff" opacity="0.05" />

  <!-- Cluttered header -->
  <rect width="1200" height="90" fill="#141414" />
  <text x="24" y="55" font-size="30" font-weight="900" fill="#ffea00">GET RICH QUICK NOW!!!</text>
  <text x="24" y="80" font-size="12" font-weight="700" fill="#00ffea">CLICK ALL THE BUTTONS</text>

  <!-- Overloaded nav bars -->
  <rect y="90" width="1200" height="60" fill="#ff00b8" />
  <rect y="150" width="1200" height="50" fill="#ffe600" />
  <text x="30" y="125" font-size="14" font-weight="900" fill="#ffffff">HOME</text>
  <text x="130" y="125" font-size="14" font-weight="900" fill="#00ffea">ABOUT US</text>
  <text x="260" y="125" font-size="14" font-weight="900" fill="#000000">FREE MONEY</text>
  <text x="410" y="125" font-size="14" font-weight="900" fill="#ff0000">WIN BIG</text>
  <text x="540" y="125" font-size="14" font-weight="900" fill="#ffffff">SUBSCRIBE</text>
  <text x="700" y="125" font-size="14" font-weight="900" fill="#000000">FLASH GAMES</text>

  <!-- Popups -->
  <rect x="80" y="200" width="200" height="130" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="100" y="230" font-size="14" font-weight="900" fill="#000000">Download Toolbar</text>
  <text x="100" y="255" font-size="12" font-weight="700" fill="#ff0000">Required to view site</text>
  <rect x="90" y="265" width="80" height="24" fill="#00a8ff" />
  <text x="105" y="282" font-size="12" fill="#ffffff" font-weight="700">Install</text>
  <rect x="180" y="265" width="80" height="24" fill="#ffae00" />
  <text x="195" y="282" font-size="12" fill="#000000" font-weight="700">Later</text>

  <rect x="920" y="190" width="210" height="120" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="940" y="220" font-size="14" font-weight="900" fill="#ff0000">ERROR 0x0BAD</text>
  <text x="940" y="245" font-size="12" font-weight="700" fill="#000000">Your PC is at risk!</text>
  <rect x="940" y="260" width="70" height="24" fill="#ff2d55" />
  <text x="955" y="277" font-size="12" font-weight="700" fill="#ffffff">Fix now</text>
  <rect x="1020" y="260" width="90" height="24" fill="#22d3ee" />
  <text x="1035" y="277" font-size="12" font-weight="700" fill="#000000">Ignore</text>

  <!-- Flashy hero -->
  <rect x="240" y="230" width="720" height="220" fill="#7a00ff" stroke="#000000" stroke-width="4" />
  <text x="260" y="270" font-size="24" font-weight="900" fill="#ffea00">WIN A FREE CAR!!!</text>
  <text x="260" y="300" font-size="16" font-weight="700" fill="#00ffea">Only 1,000,000 spots left</text>
  <rect x="260" y="320" width="180" height="44" fill="#ff2d55" />
  <text x="275" y="348" font-size="16" font-weight="900" fill="#ffffff">CLICK HERE</text>
  <rect x="460" y="320" width="180" height="44" fill="#22d3ee" />
  <text x="475" y="348" font-size="16" font-weight="900" fill="#000000">BUY NOW</text>
  <rect x="660" y="320" width="220" height="44" fill="#ffae00" />
  <text x="675" y="348" font-size="16" font-weight="900" fill="#000000">SUBSCRIBE!!!</text>

  <!-- Bad layout columns -->
  <rect x="40" y="470" width="320" height="110" fill="#00ffd5" stroke="#000000" stroke-width="3" />
  <text x="60" y="500" font-size="16" font-weight="900" fill="#000000">Blinking GIFs</text>
  <text x="60" y="525" font-size="12" font-weight="700" fill="#000000">Too many colors, no grid</text>

  <rect x="420" y="470" width="320" height="110" fill="#ff00b8" stroke="#000000" stroke-width="3" />
  <text x="440" y="500" font-size="16" font-weight="900" fill="#ffffff">Autoplay Video</text>
  <text x="440" y="525" font-size="12" font-weight="700" fill="#ffffff">Covers content, loud sounds</text>

  <rect x="800" y="470" width="360" height="110" fill="#ffd400" stroke="#000000" stroke-width="3" />
  <text x="820" y="500" font-size="16" font-weight="900" fill="#000000">Pop-up Storm</text>
  <text x="820" y="525" font-size="12" font-weight="700" fill="#000000">Ads, alerts, and confusion</text>

  <!-- Footer noise -->
  <rect y="580" width="1200" height="20" fill="#000000" />
  <text x="24" y="595" font-size="11" font-weight="700" fill="#ff2d55">Privacy? Maybe. Terms? Kinda.</text>
</svg>