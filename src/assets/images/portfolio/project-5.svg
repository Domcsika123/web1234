<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#f5f5f5"/>
  
  <!-- Phone mockup -->
  <rect x="100" y="80" width="220" height="440" fill="#000" stroke="#333" stroke-width="8" rx="20"/>
  <rect x="108" y="95" width="204" height="410" fill="#fff"/>
  
  <!-- Phone header -->
  <rect x="108" y="95" width="204" height="50" fill="#f0f0f0" stroke-width="0"/>
  <text x="130" y="125" font-size="10" font-weight="bold" fill="#000">APP NAME</text>
  
  <!-- Phone content -->
  <rect x="115" y="160" width="180" height="80" fill="#000" rx="4"/>
  <text x="130" y="195" font-size="12" fill="#fff" font-weight="bold">Your Goal</text>
  <text x="130" y="225" font-size="9" fill="#ccc">Complete by Mar 31</text>
  
  <rect x="115" y="260" width="80" height="60" fill="#f0f0f0" rx="2"/>
  <text x="122" y="282" font-size="10" font-weight="bold" fill="#000">Progress</text>
  <text x="122" y="310" font-size="9" fill="#666">65%</text>
  
  <rect x="215" y="260" width="80" height="60" fill="#f0f0f0" rx="2"/>
  <text x="222" y="282" font-size="10" font-weight="bold" fill="#000">Status</text>
  <text x="222" y="310" font-size="9" fill="#666">On Track</text>
  
  <!-- Desktop content -->
  <rect x="400" y="100" width="750" height="400" fill="#fff" stroke="#ddd" stroke-width="1" rx="4"/>
  
  <rect x="400" y="100" width="750" height="60" fill="#f8f8f8" stroke-width="0"/>
  <text x="420" y="135" font-size="16" font-weight="bold" fill="#000">Mobile App Dashboard</text>
  
  <!-- Desktop stats -->
  <rect x="420" y="190" width="160" height="80" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="2"/>
  <text x="435" y="210" font-size="12" fill="#999">Active Users</text>
  <text x="435" y="250" font-size="22" font-weight="bold" fill="#000">12,548</text>
  
  <rect x="620" y="190" width="160" height="80" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="2"/>
  <text x="635" y="210" font-size="12" fill="#999">Daily Active</text>
  <text x="635" y="250" font-size="22" font-weight="bold" fill="#000">3,847</text>
  
  <rect x="820" y="190" width="160" height="80" fill="#000" stroke="#000" stroke-width="1" rx="2"/>
  <text x="835" y="210" font-size="12" fill="#aaa">Retention</text>
  <text x="835" y="250" font-size="22" font-weight="bold" fill="#fff">87%</text>
  
  <!-- Chart -->
  <polyline points="420,380 480,350 540,365 600,340 660,355 700,330 760,345 820,325" fill="none" stroke="#999" stroke-width="2" opacity="0.2"/>
  <polyline points="420,380 480,360 540,372 600,355 660,365 700,345 760,358 820,340" fill="none" stroke="#000" stroke-width="2"/>
</svg>