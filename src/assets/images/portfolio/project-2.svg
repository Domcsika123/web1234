<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#ffffff"/>
  <rect width="1200" height="70" fill="#000"/>
  <text x="50" y="48" font-size="22" font-weight="bold" fill="#fff">ANALYTICS DASHBOARD</text>
  
  <rect x="50" y="100" width="1100" height="450" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  
  <!-- Left sidebar -->
  <rect x="50" y="100" width="180" height="450" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <line x1="50" y1="160" x2="230" y2="160" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="135" font-size="11" fill="#666">Dashboard</text>
  <text x="70" y="190" font-size="11" fill="#999">Analytics</text>
  <text x="70" y="220" font-size="11" fill="#999">Reports</text>
