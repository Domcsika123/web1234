  <!-- Chart area -->
  <rect x="280" y="270" width="600" height="150" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="300" y="290" font-size="12" fill="#999">Performance</text>
  <!-- Simple chart lines -->
  <polyline points="310,380 350,350 390,365 430,340 470,355 510,330 550,345 590,325 630,340 660,320 700,335 740,310" fill="none" stroke="#999" stroke-width="2" opacity="0.3"/>
  <polyline points="310,380 350,360 390,372 430,355 470,365 510,345 550,358 590,340 630,352 660,335 700,348 740,325" fill="none" stroke="#000" stroke-width="2"/>
